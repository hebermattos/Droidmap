id: droidmap-cors-credentials
info:
  name: "Credentialed CORS trusts the probe origin"
  author: droidmap
  severity: medium
  description: "The endpoint permits the supplied unrelated origin together with credentials. Review the origin allowlist and whether sensitive authenticated responses are affected; these headers alone do not prove data theft."
  tags: http,misconfig,exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    redirects: false
    headers:
      Origin: "https://droidmap.invalid"
    matchers-condition: and
    matchers:
      - {"type":"status","status":[200]}
      - {"type":"regex","part":"header","regex":["(?im)^access-control-allow-origin\\s*:\\s*https://droidmap\\.invalid\\s*\\r?$","(?im)^access-control-allow-credentials\\s*:\\s*true\\s*\\r?$"],"condition":"and"}

