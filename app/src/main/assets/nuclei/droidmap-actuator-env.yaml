id: droidmap-actuator-env
info:
  name: "Spring Actuator environment metadata exposed"
  author: droidmap
  severity: medium
  description: "Spring Actuator environment property sources are readable. Values can be sanitized, so secret disclosure is not assumed. Restrict the endpoint and review its exposure policy."
  tags: http,misconfig,exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/env"
    redirects: false
    matchers-condition: and
    matchers:
      - {"type":"status","status":[200]}
      - {"type":"regex","part":"header","regex":["(?im)^content-type\\s*:\\s*application/(?:[a-z0-9.+-]*\\+)?json\\b"]}
      - {"type":"regex","part":"body","regex":["\"propertySources\"\\s*:\\s*\\[","\"properties\"\\s*:\\s*\\{","\"name\"\\s*:\\s*\"[^\"]+\""],"condition":"and"}

