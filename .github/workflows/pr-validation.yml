name: Droidmap PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run scanner tests
        run: bash tests/run.sh
      - name: Run Android unit tests and lint
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Verify APK identity guards
        run: python3 tests/test-apk-identity.py

# No signing keys, workflow release tokens, or publish steps are available to PR code.
