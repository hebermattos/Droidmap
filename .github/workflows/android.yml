name: Droidmap Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package pinned ARM64 Nmap
        run: bash native-tools/build-nmap-android.sh
      - name: Fetch optional Nuclei Android runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f native-tools/nuclei-arm64.tar.gz ]]; then
            echo "Using versioned Nuclei Android ARM64 archive from repository"
            echo "2a432501808e60ab471f1ef3e4eef11904a19c69d5b31344b7f06fdd218369d5  native-tools/nuclei-arm64.tar.gz" | sha256sum --check
            mkdir -p /tmp/droidmap-nuclei
            tar -tzf native-tools/nuclei-arm64.tar.gz | grep -qx 'nuclei-arm64'
            tar -xzf native-tools/nuclei-arm64.tar.gz -C /tmp/droidmap-nuclei --no-same-owner --no-same-permissions nuclei-arm64
            echo "0c2b5a0e9110ebeb63daead62fe7a41c5e91275ff7befbeb64fe3f4e0ffdae48  /tmp/droidmap-nuclei/nuclei-arm64" | sha256sum --check
            bash native-tools/install-nuclei-android.sh /tmp/droidmap-nuclei/nuclei-arm64
          elif gh release view nuclei-android-arm64 >/dev/null 2>&1; then
            mkdir -p /tmp/droidmap-nuclei
            gh release download nuclei-android-arm64 --dir /tmp/droidmap-nuclei --pattern "libnuclei.so*"
            (cd /tmp/droidmap-nuclei && sha256sum --check libnuclei.so.sha256)
            bash native-tools/install-nuclei-android.sh /tmp/droidmap-nuclei/libnuclei.so
          else
            echo "Nuclei release not published; cannot create complete APK." >&2
            exit 1
          fi
      - name: Set up fixed test signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=debug-signing-test
          KEYSTORE="$RUNNER_TEMP/debug-test.jks"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern debug-test.jks --dir "$RUNNER_TEMP"
          else
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Droidmap Test,O=Debug,C=BR" -noprompt
            gh release create "$TAG" "$KEYSTORE#debug-test.jks" --title "PUBLIC TEST signing key" --notes "INSECURE TEST KEY; never use for production." --latest=false
          fi
          test -s "$KEYSTORE"
          echo "NETMAP_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Test scanner
        run: bash tests/run.sh
      - name: Test, build and lint Android app
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -PsideBySideInstall=false --no-daemon
      - name: Verify packaged Nmap runtime data
        run: python3 tests/verify-nmap-data.py --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Verify Nuclei packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libnuclei.so"
      - name: Verify update-compatible package and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$SDK_BUILD_TOOLS/aapt"
          test -x "$SDK_BUILD_TOOLS/apksigner"
          PACKAGE_NAME="$("$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.netmap.android" || {
            echo "Unexpected APK package: $PACKAGE_NAME" >&2
            exit 1
          }
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "Verified package ID com.netmap.android and APK signature"
      - name: Name APK clearly for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Droidmap-update.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Droidmap-update-APK
          path: dist/Droidmap-update.apk
          if-no-files-found: error
